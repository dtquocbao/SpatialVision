name: Sync API Space (Docker)

# OPTIONAL — Docker Spaces are paid on some HF plans.
# Prefer Gradio-only: app.py mounts FastAPI on dtquocbao/SpatialVision (sync-to-hub.yml).
# Keep this workflow only if you have Docker Spaces enabled.

on:
  workflow_dispatch:  # manual only — not on every push

jobs:
  sync-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage FastAPI Space files
        run: |
          cp app/SV07_backend_main.py app/ensure_data.py app/requirements-sv07.txt spaces/api/
          ls -la spaces/api

      - name: Sync → Hugging Face Docker Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: dtquocbao/SpatialVision-api
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
          subdirectory: spaces/api
